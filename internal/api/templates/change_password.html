<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password – CO Tracker</title>
  <link rel="stylesheet" href="/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons.min.css">
  <style>
    :root { --army-green: #4a5e3a; }
    body { background-color: #f0f2ee; }
    .bg-army { background-color: var(--army-green) !important; }
    .btn-army { background-color: var(--army-green); border-color: var(--army-green); color: #fff; }
    .btn-army:hover { background-color: #354530; color: #fff; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-army">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-shield-fill me-2"></i>CO Tracker
    </a>
  </div>
</nav>

<div class="container">
  <div class="row justify-content-center mt-4">
    <div class="col-md-5 col-lg-4">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-army text-white">
          <strong><i class="bi bi-key me-2"></i>Change Password</strong>
        </div>
        <div class="card-body">

          {{if .Required}}
          <div class="alert alert-warning py-2">
            <i class="bi bi-shield-exclamation me-2"></i>You're signed in with a temporary password.
            Choose your own password to continue.
          </div>
          {{end}}

          {{if .Success}}
          <div class="alert alert-success py-2">
            <i class="bi bi-check-circle me-2"></i>Password updated successfully.
          </div>
          {{end}}

          {{if .Error}}
          <div class="alert alert-danger py-2">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>{{.Error}}
          </div>
          {{end}}

          <form method="post" action="/change-password">
            <div class="mb-3">
              <label class="form-label fw-semibold">Current Password <span class="text-danger">*</span></label>
              <input type="password" name="current_password" class="form-control" required autocomplete="current-password">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">New Password <span class="text-danger">*</span></label>
              <input type="password" name="new_password" class="form-control" required
                     minlength="4" autocomplete="new-password" placeholder="Minimum 4 characters">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Confirm New Password <span class="text-danger">*</span></label>
              <input type="password" name="confirm_password" class="form-control" required
                     minlength="4" autocomplete="new-password">
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-army">Update Password</button>
              {{if not .Required}}<a href="/" class="btn btn-outline-secondary">Cancel</a>{{end}}
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
