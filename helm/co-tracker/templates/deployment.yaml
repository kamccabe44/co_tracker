apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "co-tracker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "co-tracker.labels" . | nindent 4 }}
spec:
  # Hardcoded, not a values knob: internal/store keeps one SQLite connection
  # (WAL mode, single writer). A second replica would corrupt the database.
  replicas: 1
  strategy:
    # Never run two pods against the same RWO volume, even briefly.
    type: Recreate
  selector:
    matchLabels:
      {{- include "co-tracker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "co-tracker.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: co-tracker
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: DB_PATH
              value: "/data/co_tracker.db"
            - name: USERS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ include "co-tracker.fullname" . }}-auth
                  key: USERS_JSON
            {{- with .Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "co-tracker.fullname" . }}-data
